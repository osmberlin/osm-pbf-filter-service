---
# Variables for the osm_extract_service role. Override per inventory/host.
# Target: Debian 12 (bookworm), Hetzner Cloud CX43.

# Where the sources + working files + served extracts live.
osm_root: /srv/osm

# Unprivileged user the GitHub Actions runner and the pipeline run as.
# It gets NO sudo (the role never adds it to a sudoers file or the sudo group).
osm_runner_user: osmrunner
osm_runner_home: "/home/{{ osm_runner_user }}"

# nginx server_name. "_" = catch-all default server, so the box works with only
# an IP address. Set a real hostname once a domain exists, then run certbot.
osm_download_hostname: "_"

# On-box firewall (ufw): allow 22, 80, 443 only. The Hetzner Cloud Firewall in
# front of the server is the primary filter; this is a second layer. Set to
# false if you only want the Cloud Firewall.
osm_enable_ufw: true
osm_ssh_port: 22

# System packages installed via apt.
osm_system_packages:
  - osmium-tool
  - python3-pyosmium    # Debian 12: 3.6.0, provides pyosmium-up-to-date (see tasks)
  - python3-yaml        # the only orchestrator dependency (extractor/config.py)
  - python3
  - nginx
  - git
  - jq
  - curl
  - ca-certificates
  - certbot
  - python3-certbot-nginx
  - unattended-upgrades
  - ufw
