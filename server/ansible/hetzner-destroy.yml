---
# Delete the server (and with it all downloaded data in /srv/osm). The SSH key
# and the Cloud Firewall are kept. The primary IPv4 is deleted with the server
# (its address is lost); billing stops.
#
#   ansible-playbook hetzner-destroy.yml -e confirm=yes

- name: Destroy the Hetzner Cloud server
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hcloud_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
    hcloud_server_name: osm-extracts
  module_defaults:
    group/hetzner.hcloud.all:
      api_token: "{{ hcloud_token }}"
  tasks:
    - name: Require explicit confirmation
      ansible.builtin.assert:
        that:
          - hcloud_token | length > 0
          - confirm | default('') == 'yes'
        fail_msg: >-
          This deletes server {{ hcloud_server_name }} and all its data.
          Set HCLOUD_TOKEN and pass -e confirm=yes.
        quiet: true

    - name: Delete the server
      hetzner.hcloud.server:
        name: "{{ hcloud_server_name }}"
        state: absent
