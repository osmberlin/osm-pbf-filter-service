# The extraction tree: sources (input files) at the top, regions below them.
# Activation + tag filtering are computed per run by the orchestrator: only
# sources and regions that some project needs are downloaded and cut (PLAN.md B3/B4).
#
# Sources are processed one after another, so the server only ever holds one
# continent's intermediate files. A project with `area: {region: world}` is
# filtered out of every source and the pieces are merged (osmium merge +
# time-filter, as in k-yle/OpenSeaMap-vector).

# --- sources: Geofabrik continent extracts, kept on disk, updated daily with
# Geofabrik's daily diffs (<url without -latest.osm.pbf>-updates/).
# Sizes as of 2026-10. Enable more continents to grow towards the world. Check
# Russia's coverage first: Geofabrik lists it separately from europe/asia.
sources:
  - id: europe
    url: https://download.geofabrik.de/europe-latest.osm.pbf               # ~35 GB
  # - id: africa
  #   url: https://download.geofabrik.de/africa-latest.osm.pbf             # ~7 GB
  # - id: antarctica
  #   url: https://download.geofabrik.de/antarctica-latest.osm.pbf         # <1 GB
  # - id: asia
  #   url: https://download.geofabrik.de/asia-latest.osm.pbf               # ~15 GB
  # - id: australia-oceania
  #   url: https://download.geofabrik.de/australia-oceania-latest.osm.pbf  # ~1.5 GB
  # - id: central-america
  #   url: https://download.geofabrik.de/central-america-latest.osm.pbf    # ~1 GB
  # - id: north-america
  #   url: https://download.geofabrik.de/north-america-latest.osm.pbf      # ~19 GB
  # - id: south-america
  #   url: https://download.geofabrik.de/south-america-latest.osm.pbf      # ~4 GB

# --- regions: `parent` is a source id or another region. `polygon` must be a
# GeoJSON Polygon/MultiPolygon; it is validated each run, and invalid geometry
# is skipped and reported in the Action.
regions:
  - id: germany
    name: Germany
    parent: europe
    polygon: ./polygons/germany.geojson      # Geofabrik europe/germany.poly

  - id: france
    name: France
    parent: europe
    polygon: ./polygons/france.geojson       # Geofabrik europe/france.poly

  - id: hessen
    name: Hessen
    parent: germany
    polygon: ./polygons/hessen.geojson       # Geofabrik europe/germany/hessen.poly

  # Test region: OSM boundary admin_level=9 "Neukölln" (Berlin district).
  - id: neukoelln
    name: Neukölln (Berlin) — test
    parent: germany
    polygon: ./polygons/neukoelln.geojson
