# From the FMC tech-stack template (tilda-geo), trimmed for this repo.
# Schedule: open-source repos → first Friday of the month, 07:00 Europe/Berlin.
# No pip entry: the orchestrator uses the standard library + apt python3-yaml (no lockfile).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /experiments/performance
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker-bases:
        patterns:
          - '*'
