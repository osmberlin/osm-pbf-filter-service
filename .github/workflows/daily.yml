# Daily pipeline: update the sources, build the extracts, commit metadata.
# See PLAN.md Part C. Runs on the self-hosted runner on our own server.
name: daily

on:
  schedule:
    # Geofabrik's daily diffs cover data up to ~20:20 UTC and are published soon
    # after; 02:17 is safely later and avoids the top-of-hour cron rush.
    - cron: "17 2 * * *"
  workflow_dispatch: {}        # allow manual runs

# Don't let two pipeline runs touch the sources at once.
concurrency:
  group: osm-pipeline
  cancel-in-progress: false

# Least privilege by default; the commit step opts into write below.
permissions:
  contents: read

jobs:
  pipeline:
    runs-on: [self-hosted, osm]
    # A hung osmium would otherwise hold the concurrency group forever and
    # silently stop all future daily runs.
    timeout-minutes: 600
    permissions:
      contents: write          # only this job commits status/ + plan.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # don't leave a token in .git/config on the runner

      - name: Guard free disk (before update)
        run: ./scripts/check-disk.sh        # an update rewrites a whole source file

      - name: Update sources (download missing, apply Geofabrik daily diffs)
        run: python3 -m extractor update

      - name: Guard free disk (before build)
        run: ./scripts/check-disk.sh        # intermediate extracts need room too

      - name: Build extracts
        run: python3 -m extractor build     # stdlib + apt python3-yaml

      - name: Clean intermediate work files
        if: always()             # even on failure: intermediates are GBs
        run: rm -f /srv/osm/work/*.osm.pbf /srv/osm/work/*.json /srv/osm/work/*.tmp

      - name: Commit resolved plan + status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read by the credential helper; never persisted or put in argv
        run: ./scripts/commit-results.sh
