# Unit tests for the orchestrator logic. Runs on GitHub-hosted runners — NEVER
# the self-hosted runner — so fork PRs can't execute on the server (PLAN.md §A3).
#
# Repo settings gate PR code (done 2026-10-25, see README "GitHub repository
# settings"): only collaborators can open PRs, and fork PR workflows need
# approval for all external contributors.
name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # tests never push; don't expose the token
      # The runner image's python3 is enough: the tests use only the standard
      # library (unittest); the YAML-loading module is not imported by them.
      - run: python3 -m unittest -v
